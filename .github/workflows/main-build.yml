name: "Main Branch Build"

# Runs the shipped-target build (Linux deb/rpm + Windows NSIS/MSI) on every push
# to main — the same matrix release.yml uses, so breakage is caught before a
# manual release is triggered. Artifacts are kept for 30 days so any commit on
# main has a downloadable, testable build.

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04" # deb + rpm. Built on glibc 2.35 so the binaries stay loadable on both targets (Astra Linux SE 1.8, РЕДОС 8 — glibc 2.36). glibc and libstdc++ are forward-compatible only, so the build host must never be newer than the target.
            args: "--bundles deb,rpm"
            target: "x86_64-unknown-linux-gnu"
          - platform: "windows-latest" # Builds NSIS and MSI; NSIS shows "ХЭНДИ", MSI shows ASCII "Handy" (forced: PRODUCTNAME drives install path + upgrade identity — see nsis/installer.nsi).
            args: ""
            target: "x86_64-pc-windows-msvc"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      upload-artifacts: true
      sign-binaries: false
    secrets: inherit
