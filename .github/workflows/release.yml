name: "Release"

on: workflow_dispatch

# Two concurrent runs would delete each other's release assets mid-upload.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  ensure-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      # actions/github-script exposes exactly one output, named `result`, holding
      # whatever the script returns. The step id is NOT the output name, so
      # `steps.ensure-release.outputs.release-id` would resolve to empty.
      release-id: ${{ steps.ensure-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version from tauri.conf.json: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # An empty VERSION would silently become the tag "vundefined" and create
          # a release under it, so stop loudly instead.
          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not read version from src-tauri/tauri.conf.json"
            exit 1
          fi

      - name: Ensure Draft Release (reuse tag, replace assets)
        id: ensure-release
        uses: actions/github-script@v9
        with:
          script: |
            const tag = `v${{ steps.get-version.outputs.version }}`;
            // GET /releases/tags/{tag} never returns drafts, so a re-release would
            // find nothing. The paginated list is the only way to see a draft.
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const existing = releases.find((r) => r.tag_name === tag);

            if (existing) {
              if (!existing.draft) {
                core.warning(
                  `${tag} is already PUBLISHED. This run replaces its assets, so its ` +
                    `download links will 404 until the rebuild finishes. Reusing the ` +
                    `tag is intentional: re-releases are expected under one tag.`
                );
              }
              core.info(
                `Reusing release #${existing.id} for ${tag}; deleting ${existing.assets.length} existing asset(s)`
              );
              // A target only replaces assets whose names it re-uploads, so assets
              // from an earlier partial run — or from a bundle type the current
              // matrix no longer builds — would linger forever. Clear the whole set
              // so each run leaves exactly one asset per bundle.
              for (const asset of existing.assets) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id
                });
                core.info(`Deleted asset "${asset.name}" (id ${asset.id})`);
              }
              return existing.id;
            }

            core.info(`No release found for ${tag}; creating a draft`);
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              draft: true,
              prerelease: false,
              generate_release_notes: true
            });
            return data.id

  publish-tauri:
    permissions:
      contents: write
    needs: ensure-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04" # Build .deb and .rpm on 22.04, whose glibc (2.35) is new enough for both Astra Linux SE 1.8 and РЕДОС 8, which ship glibc 2.36.
            args: "--bundles deb,rpm"
            target: "x86_64-unknown-linux-gnu"
          - platform: "windows-latest" # Builds NSIS and MSI; NSIS shows "ХЭНДИ", MSI shows ASCII "Handy".
            target: "x86_64-pc-windows-msvc"
            args: ""

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      sign-binaries: false
      asset-prefix: "handy"
      upload-artifacts: false
      release-id: ${{ needs.ensure-release.outputs.release-id }}
      # Releases always build from scratch — never restore the Rust cache, so a
      # stale cached native lib can never be linked into a shipped artifact.
      no-cache: true
    secrets: inherit

  # Publishing is a separate, final job so a failed target can never ship a
  # half-built release: needs: makes this unreachable unless every target is green.
  publish-release:
    permissions:
      contents: write
    needs: [ensure-release, publish-tauri]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ needs.ensure-release.outputs.release-id }}
        with:
          script: |
            const releaseId = process.env.RELEASE_ID;
            if (!releaseId) {
              core.setFailed(`RELEASE_ID was empty; cannot publish release`);
              return;
            }
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              draft: false
            });
            core.info(`Published release #${releaseId}`);
